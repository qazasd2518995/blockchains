<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>黃金賽特 II：覺醒之力</title>
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="false" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="full-screen" content="yes" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="360-fullscreen" content="true" />
    <meta name="x5-page-mode" content="app" />
    <link rel="icon" href="public/favicon.ico" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="game.css" />
    <!-- Pull the startup dependency chain onto the wire before SystemJS and
         Cocos discover it serially. These are the original full-quality files. -->
    <link rel="preload" href="./app.js" as="script" />
    <link rel="preload" href="./application.js" as="script" />
    <link rel="preload" href="./src/settings.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="./cocos-js/cc.js" as="script" />
    <link rel="preload" href="./assets/internal/config.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="./assets/main/config.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="./assets/main/index.js" as="script" crossorigin="anonymous" />
    <link rel="preload" href="./assets/resources/config.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="./assets/g1005/config.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="./assets/g1005/index.js" as="script" crossorigin="anonymous" />
  </head>
  <body>
    <div id="logo"><img src="./public/atg.png" alt="" /></div>
    <div id="loadingMsg" role="status" aria-live="polite">遊戲載入中…</div>
    <div id="orientation"><div class="icon"></div></div>
    <div class="blur"></div>
    <div id="swipe">
      <div class="swipe"></div>
      <div class="fullscreen-icon"></div>
    </div>
    <div id="GameWrapper">
      <div id="GameDiv" cc_exact_fit_screen="true">
        <div id="Cocos3dGameContainer">
          <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
        </div>
      </div>
      <div id="version"></div>
    </div>
    <script>
      if (document.documentElement && document.documentElement.ontouchstart === undefined) {
        document.documentElement.ontouchstart = function () {};
      }
      ['logo', 'orientation'].forEach(function (id) {
        document.getElementById(id).addEventListener(
          'touchend',
          function (event) {
            event.preventDefault();
          },
          { passive: false },
        );
      });
    </script>
    <script src="./app.js"></script>
    <script src="src/polyfills.bundle.js" charset="utf-8"></script>
    <script src="src/system.bundle.js" charset="utf-8"></script>
    <script src="src/seth2-local-adapter.js?v=20260823-crowd-marquee-2"></script>
    <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>
    <script>
      System.import('./index.js').catch(function (error) {
        console.error(error);
      });
    </script>
  </body>
</html>
