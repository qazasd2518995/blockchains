  <body>
    <div id="logo"><img src="./public/atg.png" alt="" /></div>
    <div id="loadingMsg" role="status" aria-live="polite">遊戲載入中…</div>
    <div id="orientation"><div class="icon"></div></div>
    <div class="blur"></div>
    <div id="swipe">
      <div class="swipe"></div>
      <div class="fullscreen-icon"></div>
    </div>
    <div id="GameWrapper">
      <div id="GameDiv" cc_exact_fit_screen="true">
        <div id="Cocos3dGameContainer">
          <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
        </div>
      </div>
      <div id="version"></div>
    </div>
    <script>
      if (document.documentElement && document.documentElement.ontouchstart === undefined) {
        document.documentElement.ontouchstart = function () {};
      }
      ['logo', 'orientation'].forEach(function (id) {
        document.getElementById(id).addEventListener(
          'touchend',
          function (event) {
            event.preventDefault();
          },
          { passive: false },
        );
      });
    </script>
    <script>
      // Cocos' imported resources normally use immutable UUID URLs. Revise the
      // corrected portrait loading prefab so returning players do not keep the
      // previously cached layout for the lifetime of that immutable response.
      (function () {
        var revisedPath =
          '/games/storm-of-seth-2-v115/assets/resources/import/3e/3e8965eb-cf9e-4542-b1f5-93891a50a8c9.json';
        var originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          var nextUrl = url;
          try {
            var parsedUrl = new URL(String(url), window.location.href);
            if (parsedUrl.origin === window.location.origin && parsedUrl.pathname === revisedPath) {
              parsedUrl.searchParams.set('v', '20260905-loading-widget-center-2');
              nextUrl = parsedUrl.href;
            }
          } catch (_error) {
            // Preserve the engine's original request when a non-standard URL is supplied.
          }
          var remainingArguments = Array.prototype.slice.call(arguments, 2);
          return originalOpen.apply(this, [method, nextUrl].concat(remainingArguments));
        };
      })();
    </script>
    <script src="./app.js"></script>
    <script src="src/polyfills.bundle.js" charset="utf-8"></script>
    <script src="src/system.bundle.js" charset="utf-8"></script>
    <script src="src/seth2-local-adapter.js?v=20260905-split-completion-2"></script>
    <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>
    <script>
      System.import('./index.js').catch(function (error) {
        console.error(error);
      });
    </script>
  </body>
</html>
