<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#dff4ff">
    <meta name="color-scheme" content="light">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https:; img-src 'self' data:; media-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    >
    <title>錢女友｜遊戲大廳</title>
    <link rel="icon" href="/qmoney/assets/favicon.ico">
    <link rel="stylesheet" href="/qmoney/styles.css">
    <script src="/qmoney/config.js"></script>
    <script src="/qmoney/app.js?v=20260827-return-no-login-flash-1" defer></script>
  </head>
  <body class="is-booting">
    <div class="app-frame" id="appFrame">
      <div class="qmoney-boot-view" id="bootView" role="status" aria-label="遊戲大廳載入中">
        <img src="/qmoney/assets/imgs_soc/media/loading.gif" alt="">
        <span>正在返回遊戲大廳…</span>
      </div>
      <section class="login-page view is-active" id="loginView" aria-label="登入畫面">
        <div class="login-actions" aria-label="會員登入入口">
          <button class="pill-button pill-button--line" id="lineLogin" type="button">
            <span><img class="line-login-icon" src="/qmoney/assets/imgs_soc/icon/line.webp" alt="">會員登入</span>
          </button>
          <button class="pill-button pill-button--web" id="webLogin" type="button">
            <span>帳密登入</span>
          </button>
        </div>
        <div class="login-page-footer" aria-hidden="true">
          <img class="footer-art footer-art--left" src="/qmoney/assets/imgs_soc/media/login-page_footer-left.webp" alt="">
          <img class="footer-art footer-art--right" src="/qmoney/assets/imgs_soc/media/login-page_footer-right.webp" alt="">
        </div>
      </section>

      <section class="lobby view" id="lobbyView" aria-label="遊戲大廳" aria-hidden="true">
        <header class="lobby-header">
          <button class="profile-button" type="button" data-action="profile" aria-label="開啟我的資料">
            <img src="/qmoney/assets/imgs_soc/media/user_default.webp" alt="會員頭像">
          </button>
          <button class="member-summary" type="button" data-action="profile">
            <strong><span id="accountName">會員</span> (<span id="accountId">--</span>)</strong>
            <span class="member-tags"><b>◉我的</b><i>VIP<span id="vipLevel">0</span></i></span>
          </button>
          <button class="balance-row" type="button" data-action="refresh-balance" aria-label="更新點數">
            <img src="/qmoney/assets/imgs_soc/media/coin.webp" alt="">
            <strong id="balanceValue">--</strong>
            <img class="refresh-icon" src="/qmoney/assets/imgs_soc/icon/refresh.webp" alt="更新">
          </button>
          <button class="header-settings" type="button" data-action="settings" aria-label="設定">
            <img src="/qmoney/assets/imgs_soc/media/setting.svg" alt="">
          </button>
        </header>

        <main class="lobby-scroll" id="lobbyScroll">
          <section class="hero-carousel" aria-label="活動輪播">
            <div class="hero-track" id="heroTrack">
              <button class="hero-slide is-active" type="button" data-banner="0">
                <img src="/qmoney/assets/img/task/%E6%96%B0%E5%A2%9E%E8%B3%87%E6%96%99%E5%A4%BE/drive-download-20250207T020939Z-001/img_banner3tw.webp" alt="真人每週任務">
              </button>
              <button class="hero-slide" type="button" data-banner="1">
                <img src="/qmoney/assets/img/task/%E6%96%B0%E5%A2%9E%E8%B3%87%E6%96%99%E5%A4%BE/drive-download-20250207T020939Z-001/img_banner1tw.webp" alt="電子每週任務">
              </button>
              <button class="hero-slide" type="button" data-banner="2">
                <img src="/qmoney/assets/img/task/%E6%96%B0%E5%A2%9E%E8%B3%87%E6%96%99%E5%A4%BE/drive-download-20250207T020939Z-001/img_banner2tw.webp" alt="每日續存">
              </button>
              <button class="hero-slide" type="button" data-banner="3">
                <img src="/qmoney/assets/img/task/%E6%96%B0%E5%A2%9E%E8%B3%87%E6%96%99%E5%A4%BE/drive-download-20250207T020939Z-001/img_banner4tw.webp" alt="電子救援金">
              </button>
            </div>
            <div class="carousel-dots" id="carouselDots" aria-label="選擇活動">
              <button class="is-active" type="button" data-slide="0" aria-label="第 1 張"></button>
              <button type="button" data-slide="1" aria-label="第 2 張"></button>
              <button type="button" data-slide="2" aria-label="第 3 張"></button>
              <button type="button" data-slide="3" aria-label="第 4 張"></button>
            </div>
          </section>

          <button class="announcement-ticker" type="button" data-action="notices" aria-label="查看公告">
            <span class="ticker-speaker">🔊</span>
            <span class="ticker-window"><span id="tickerTrack">錢女友遊戲大廳已上線，立即開玩</span></span>
          </button>

          <nav class="category-tabs" id="categoryTabs" aria-label="遊戲分類">
            <button class="category-tab is-active" type="button" data-category="全部"><span>全部</span></button>
            <button class="category-tab" type="button" data-category="最愛"><span>最愛</span></button>
            <button class="category-tab" type="button" data-category="電子"><span>電子</span></button>
            <button class="category-tab" type="button" data-category="捕魚"><span>捕魚</span></button>
            <button class="category-tab" type="button" data-category="棋牌"><span>棋牌</span></button>
            <button class="category-tab" type="button" data-category="加密遊戲"><span>加密遊戲</span></button>
            <button class="category-search" id="searchToggle" type="button" aria-label="搜尋遊戲">⌕</button>
          </nav>

          <label class="game-search" id="gameSearchWrap" hidden>
            <span class="sr-only">搜尋遊戲</span>
            <input id="gameSearch" type="search" placeholder="搜尋遊戲名稱" autocomplete="off">
            <button type="button" id="searchClose" aria-label="關閉搜尋">×</button>
          </label>

          <section class="provider-strip" id="providerStrip" aria-label="遊戲館別">
            <button type="button" data-provider-category="電子" aria-label="電子遊戲">
              <img src="/qmoney/assets/imgs_soc/game/CN/atg.webp" alt="ATG Gaming">
            </button>
            <button class="is-active" type="button" data-provider-category="全部" aria-label="錢女友遊戲">
              <img src="/qmoney/assets/imgs_soc/game/CN/all.webp" alt="錢女友">
            </button>
            <button type="button" data-provider-category="電子" aria-label="KS Gaming">
              <img src="/qmoney/assets/imgs_soc/game/CN/ks.webp" alt="KS Gaming">
            </button>
            <button type="button" data-provider-category="捕魚" aria-label="RSG Gaming">
              <img src="/qmoney/assets/imgs_soc/game/CN/rsg.webp" alt="RSG Gaming">
            </button>
          </section>

          <button class="jackpot-card" type="button" data-action="jackpot" aria-label="查看幸運彩池">
            <span class="jackpot-digits" id="jackpotDigits" aria-label="Jackpot 0335141310"></span>
          </button>

          <section class="games-section" aria-labelledby="gamesTitle">
            <div class="section-heading">
              <h1 id="gamesTitle">熱門遊戲</h1>
              <span id="gamesCount"></span>
            </div>
            <div class="game-grid" id="gameGrid" aria-live="polite"></div>
            <p class="empty-state" id="emptyState" hidden>找不到符合條件的遊戲</p>
          </section>
          <div class="lobby-safe-space" aria-hidden="true"></div>
        </main>

        <div class="side-tools" aria-label="快捷功能">
          <button type="button" data-action="notices"><img src="/qmoney/assets/imgs_soc/media/chat.webp" alt=""><span>聊天</span></button>
          <button type="button" data-action="check-in"><img src="/qmoney/assets/imgs_soc/media/CheckIn.webp" alt=""><span>簽到</span></button>
          <button type="button" data-action="jackpot"><img src="/qmoney/assets/imgs_soc/media/turntable.webp" alt=""><span>輪盤</span></button>
          <button class="scroll-top" type="button" data-action="scroll-top" aria-label="回到頂端">⌃</button>
        </div>

        <nav class="bottom-nav" aria-label="主要功能">
          <button class="is-active" type="button" data-footer="其他"><img src="/qmoney/assets/imgs_soc/footer/more.webp" alt=""><span>其他</span></button>
          <button type="button" data-footer="排行榜"><img src="/qmoney/assets/imgs_soc/footer/winner.webp" alt=""><span>排行榜</span></button>
          <button class="bottom-store" type="button" data-footer="商城"><img src="/qmoney/assets/imgs_soc/footer/store.webp" alt=""><span>商城</span></button>
          <button type="button" data-footer="贈禮"><img src="/qmoney/assets/imgs_soc/footer/gift.webp" alt=""><span>贈禮</span></button>
          <button type="button" data-footer="公會"><img src="/qmoney/assets/imgs_soc/footer/guild.webp" alt=""><span>公會</span></button>
        </nav>
      </section>

      <div class="modal-backdrop" id="modalBackdrop" hidden>
        <section class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <button class="modal-close" id="modalClose" type="button" aria-label="關閉">×</button>
          <div class="modal-content" id="modalContent"></div>
        </section>
      </div>

      <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite" hidden>
        <div class="source-loader">
          <img id="loadingImage" src="/qmoney/assets/imgs_soc/media/loading.gif" alt="">
          <p>載入中...</p>
          <strong id="loadingGameName">正在啟動遊戲</strong>
        </div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <audio id="loginMusic" src="/qmoney/assets/imgs_soc/mp3/login_page.mp3" preload="metadata" loop></audio>
    <audio id="lobbyMusic" src="/qmoney/assets/imgs_soc/mp3/lobby_page.mp3" preload="metadata" loop></audio>
    <audio id="storeMusic" src="/qmoney/assets/imgs_soc/mp3/store_page.mp3" preload="metadata" loop></audio>
    <audio id="clickTab" data-volume="0.602" src="/qmoney/assets/imgs_soc/mp3/click_tab.mp3" preload="auto"></audio>
    <audio id="clickGame" src="/qmoney/assets/imgs_soc/mp3/click_game.mp3" preload="auto"></audio>
    <audio id="clickConfirm" src="/qmoney/assets/imgs_soc/mp3/click_confirm.mp3" preload="auto"></audio>
    <audio id="clickCancel" src="/qmoney/assets/imgs_soc/mp3/click_cancel.mp3" preload="auto"></audio>
    <audio id="clickFooter" src="/qmoney/assets/imgs_soc/mp3/click_footer.mp3" preload="auto"></audio>
    <audio id="addFavorite" data-volume="0.602" src="/qmoney/assets/imgs_soc/mp3/add_favorite.mp3" preload="auto"></audio>
    <audio id="removeFavorite" data-volume="0.602" src="/qmoney/assets/imgs_soc/mp3/remove_favorite.mp3" preload="auto"></audio>
    <audio id="getReward" src="/qmoney/assets/imgs_soc/mp3/get_reward.mp3" preload="auto"></audio>
  </body>
</html>
