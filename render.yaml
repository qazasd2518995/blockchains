# Render Blueprint — 加密博彩遊戲平台
# 6 個服務 + 2 套獨立 PostgreSQL
#
# 服務組成：
#   1. bg-api            (Node) — 原娛樂城 API，使用既有 blockchains DB
#   2. bg-web            (Static) — 原娛樂城玩家前端
#   3. bg-qmoney         (Static) — 新娛樂城玩家前端
#   4. bg-qmoney-api     (Node) — 新娛樂城獨立 API，使用 bg-qmoney-db
#   5. bg-qmoney-admin   (Static) — 新娛樂城獨立代理後台
#   6. bg-admin          (Static) — 原娛樂城代理後台
#
# 部署步驟：
#   1. 在 Render → New → Blueprint，選本 repo
#   2. Render 會讀這份 YAML 自動建立新娛樂城的 API、DB 與代理後台
#   3. 手動設 Secret：DATABASE_URL / JWT_SECRET / SUPER_ADMIN_PASSWORD / BACCARAT_INTEGRATION_SECRET
#   4. Deploy 後在 api service 跑 migration + seed-agent（見 README 部署章節）
#
# 重要：修改 CORS_ORIGIN 和前端 VITE_API_BASE 為你實際的 Render URL / 自訂網域

services:
  # ──────────────────────────────────────────
  # 1. 後端 API（Fastify + Socket.IO）
  # ──────────────────────────────────────────
  - type: web
    name: bg-api
    runtime: node
    plan: starter # free 會 sleep，建議 starter
    region: oregon # DB 同 region
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.15.4 --activate
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @bg/shared run build
      pnpm --filter @bg/provably-fair run build
      pnpm --filter @bg/server exec prisma generate
      pnpm --filter @bg/server run build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLATFORM_REALM
        value: legacy
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: SIGNUP_BONUS
        value: 1000
      - key: MAX_SINGLE_BET
        value: 100000
      - key: ENTERTAINMENT_SHAPER_ENABLED
        value: 'true'
      - key: ENTERTAINMENT_SHAPER_GAMES
        value: slot,mines,tower
      - key: ENTERTAINMENT_SHAPER_SOURCES
        value: auto_balance
      # ── 下面需要在 Dashboard 手動設為 Secret ──
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # 必須與百家樂後端的 BG_INTEGRATION_SECRET 完全相同
      - key: BACCARAT_INTEGRATION_SECRET
        sync: false
      - key: SUPER_ADMIN_USERNAME
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # ── CORS：填前端網址（含 https://）。目前正式網域：
      # 代理後台 yachiyo168.com / yachiyo188.com；遊戲前台 yachiyo666.com / yachiyo777.com
      - key: CORS_ORIGIN
        sync: false

  # ──────────────────────────────────────────
  # 2. 玩家前端（apps/web）
  # ──────────────────────────────────────────
  - type: web
    name: bg-web
    runtime: static
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.15.4 --activate
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @bg/shared run build
      pnpm --filter @bg/provably-fair run build
      pnpm --filter @bg/web run build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: false
    headers:
      # Mutable app-shell files must always revalidate. This is especially
      # important for Android/iOS installed Web Apps, otherwise an old shell
      # can keep loading a removed account gate indefinitely.
      - path: /
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /qmoney/index.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /qmoney/app.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /qmoney/config.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /qmoney/styles.css
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /qmoney/assets/*
        name: Cache-Control
        value: public, max-age=604800
      # Vite and Cocos build artifacts are content/version fingerprinted. Keep
      # mutable HTML and adapter bridges out of these rules so releases remain
      # immediately replaceable while repeat game visits reuse the heavy files.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/storm-of-seth-2/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/storm-of-seth-2/src/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/storm-of-seth-2/cocos2d-js-min.b1c26.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/storm-of-seth-2/physics-min.941a2.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/storm-of-seth-2/main.47d5a.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/storm-of-seth-2/style-mobile.25fc5.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/storm-of-seth-2/favicon.8de18.ico
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/storm-of-seth-2-v115/src/seth2-local-adapter.js
        name: Cache-Control
        value: no-cache
      - path: /games/storm-of-seth-2-v115/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/storm-of-seth-2-v115/cocos-js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/storm-of-seth-2-v115/src/chunks/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /slotFramework/40401f29702686de9cfed69b217641b6029834f7/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /slotFramework/manifest.json
        name: Cache-Control
        value: no-cache
      - path: /games/h5-slot-collection/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/h5-slot-collection/yachiyo-adapter.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /games/h5-slot-collection/src/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/h5-slot-collection/cocos2d-js-min.22f51.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/h5-slot-collection/main.649de.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/h5-slot-collection/style-mobile.25fc5.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/h5-slot-collection/favicon.8de18.ico
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /games/fruit-mary/fruit-mary-adapter.js
        name: Cache-Control
        value: no-cache, must-revalidate
    routes:
      - type: rewrite
        source: /qmoney
        destination: /qmoney/index.html
      - type: rewrite
        source: /qmoney/
        destination: /qmoney/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false # 填 https://bg-api.onrender.com 或自訂 api 網域
      - key: VITE_SOCKET_BASE
        sync: false # 通常同 VITE_API_BASE
      - key: VITE_BACCARAT_URL
        sync: false # 填百家樂前端網址，例如 https://baccarat-frontend-74oz.onrender.com
      - key: VITE_IMAGE_TRANSFORM_PROVIDER
        value: local # local 使用 /_optimized；Cloudflare 可改 cloudflare
      - key: VITE_IMAGE_CDN_BASE
        sync: false # Cloudflare Transform/CDN 網域，例如 https://cdn.example.com

  # ──────────────────────────────────────────
  # 3. 新娛樂城前端（只共用程式碼，帳號與資料由 bg-qmoney-api 管理）
  # ──────────────────────────────────────────
  - type: web
    name: bg-qmoney
    runtime: static
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.15.4 --activate
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @bg/shared run build
      pnpm --filter @bg/provably-fair run build
      pnpm --filter @bg/web run build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /platform.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /qmoney/index.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /qmoney/app.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /qmoney/config.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /qmoney/styles.css
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /qmoney/assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /qmoney
        destination: /qmoney/index.html
      - type: rewrite
        source: /qmoney/
        destination: /qmoney/index.html
      - type: rewrite
        source: /*
        destination: /platform.html
    envVars:
      # 新娛樂城只連自己的 API；不可指向原本的 bg-api。
      - key: VITE_API_BASE
        value: https://bg-qmoney-api.onrender.com
      - key: VITE_SOCKET_BASE
        value: https://bg-qmoney-api.onrender.com
      - key: VITE_BACCARAT_URL
        value: https://baccarat-frontend-74oz.onrender.com
      - key: VITE_IMAGE_TRANSFORM_PROVIDER
        value: local
      - key: QMONEY_ROOT
        value: 'true'

  # ──────────────────────────────────────────
  # 4. 新娛樂城獨立 API（帳號、JWT、流水與控制資料完全分開）
  # ──────────────────────────────────────────
  - type: web
    name: bg-qmoney-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.15.4 --activate
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @bg/shared run build
      pnpm --filter @bg/provably-fair run build
      pnpm --filter @bg/server exec prisma generate
      pnpm --filter @bg/server run build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLATFORM_REALM
        value: qmoney
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: SIGNUP_BONUS
        value: 1000
      - key: MAX_SINGLE_BET
        value: 100000
      - key: ENTERTAINMENT_SHAPER_ENABLED
        value: 'true'
      - key: ENTERTAINMENT_SHAPER_GAMES
        value: slot,mines,tower
      - key: ENTERTAINMENT_SHAPER_SOURCES
        value: auto_balance
      - key: DATABASE_URL
        fromDatabase:
          name: bg-qmoney-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BACCARAT_INTEGRATION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://bg-qmoney.onrender.com,https://bg-qmoney-admin.onrender.com

  # ──────────────────────────────────────────
  # 5. 新娛樂城獨立代理後台（介面共用，資料只讀寫 bg-qmoney-api）
  # ──────────────────────────────────────────
  - type: web
    name: bg-qmoney-admin
    runtime: static
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.15.4 --activate
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @bg/shared run build
      pnpm --filter @bg/admin run build
    staticPublishPath: apps/admin/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://bg-qmoney-api.onrender.com

  # ──────────────────────────────────────────
  # 6. 原娛樂城代理後台（apps/admin）
  # ──────────────────────────────────────────
  - type: web
    name: bg-admin
    runtime: static
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9.15.4 --activate
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @bg/shared run build
      pnpm --filter @bg/admin run build
    staticPublishPath: apps/admin/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false

databases:
  # 新娛樂城使用獨立的持久化資料庫；不引用既有 blockchains DB。
  - name: bg-qmoney-db
    plan: basic-256mb
    region: oregon
    databaseName: bg_qmoney
    user: bg_qmoney_user
    diskSizeGB: 5
